- insert:
    - id: dsh-memory-core
      name: dsh-memory-core
      config:
        memoryRoot: "D:\\dsh-workspace\\memory"
        dialogueFile: "D:\\dsh-workspace\\对话记录.md"
        topK: 3
        timeoutMs: 150
        maxBlockChars: 2400
        halfLifeDays: 30
        dailyQuota: 10
        minCoverage: 0.2
        minMatched: 2
        enableStable: true
        enableAutoCapture: true
        enableMemoryNav: true
        summaryMaxChars: 600
        enableSummary: true
        summarizeIntervalMinutes: 10
        summarizeIdleMinutes: 30
        enableSanitize: true
